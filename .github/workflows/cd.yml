name: CD

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd app

            echo "NODE_ENV=dev" > .env
            echo "PORT=3002" >> .env
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DB_DATABASE=${{ secrets.DB_DATABASE }}" >> .env
            echo "ADMIN_PASSKEY=${{ secrets.ADMIN_PASSKEY }}" >> .env

            git pull origin develop

            sudo docker stop forest-back || true
            sudo docker rm forest-back || true
            sudo docker build -t forest-back .
            sudo docker run -d -p 3002:3002 --name forest-back forest-back
